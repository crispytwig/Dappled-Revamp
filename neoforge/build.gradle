plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neo_version
    runs {
        configureEach {
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})"
        }
        client {
            client()
            gameDirectory = project.file('run')
        }
        clientData {
            clientData()
            gameDirectory = project.file('run/data')
            programArguments.addAll '--mod', mod_id,
                    '--output', rootProject.file('common/src/generated/resources').absolutePath
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

applyLoaderAttribute('neoforge', ['apiElements', 'runtimeElements', 'sourcesElements'], ['jarJar'])
